stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ''

build_all:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - build
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" fonteyncr.azurecr.io
  script:
    - docker-compose up --build -d
    - docker tag fonteyncr.azurecr.io/booking fonteyncr.azurecr.io/booking:$CI_COMMIT_SHORT_SHA
    - docker tag fonteyncr.azurecr.io/hrm fonteyncr.azurecr.io/hrm:$CI_COMMIT_SHORT_SHA
    - docker push fonteyncr.azurecr.io/booking:$CI_COMMIT_SHORT_SHA
    - docker push fonteyncr.azurecr.io/hrm:$CI_COMMIT_SHORT_SHA

.deploy_template: &deploy_template
  stage: deploy
  image:
    name: mcr.microsoft.com/azure-cli:latest
    entrypoint: [""]

  tags:
    - deploy
  before_script:
    - az login --service-principal -u "$AZ_CLIENT_ID" -p "$AZ_CLIENT_SECRET" --tenant "$AZ_TENANT_ID"
    - az aks install-cli --install-location /usr/local/bin/kubectl --kubelogin-install-location /usr/local/bin/kubelogin
    - az aks get-credentials -g "$AKS_RG" -n "$AKS_CLUSTER" --file kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - kubelogin convert-kubeconfig --login spn --client-id "$AZ_CLIENT_ID" --client-secret "$AZ_CLIENT_SECRET" --tenant-id "$AZ_TENANT_ID"
  script:
    - echo "$HRM_TLS_CRT" > hrm_tls.crt
    - echo "$HRM_TLS_KEY" > hrm_tls.key
    - echo "$BOOKING_TLS_CRT" > booking_tls.crt
    - echo "$BOOKING_TLS_KEY" > booking_tls.key
    - kubectl delete secret hrm-tls-secret --ignore-not-found
    - kubectl create secret tls hrm-tls-secret --cert=hrm_tls.crt --key=hrm_tls.key
    - kubectl delete secret booking-tls-secret --ignore-not-found
    - kubectl create secret tls booking-tls-secret --cert=booking_tls.crt --key=booking_tls.key
    - kubectl apply -f ./$APP_NAME/k8s/ingress.yml

    - mkdir -p hrm_secure
    - echo "$HRM_ENV_FILE" > ./hrm_secure/.env

    - mkdir -p booking_secure
    - echo "$BOOKING_ENV_FILE" > ./booking_secure/.env

    - kubectl delete configmap hrm-dotenv --ignore-not-found
    - kubectl create configmap hrm-dotenv --from-file=.env=./hrm_secure/.env

    - kubectl delete configmap booking-dotenv --ignore-not-found
    - kubectl create configmap booking-dotenv --from-file=.env=./booking_secure/.env


    - sed "s|IMAGE_TAG|$CI_COMMIT_SHORT_SHA|g" ./$APP_NAME/k8s/deployment.yml | kubectl apply -f -
    - kubectl apply -f ./$APP_NAME/k8s/service.yml


deploy_booking:
  variables:
    APP_NAME: test2
  needs: ["build_all"]
  <<: *deploy_template

deploy_hrm:
  variables:
    APP_NAME: HRM
  needs: ["build_all"]
  <<: *deploy_template 
