stages:
  - build
  - deploy

build_all:
  stage: build
  image: docker:20.10
  services:
    - docker:dind
  tags:
    - kubernetes
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY_URL
  script:
    - docker-compose build
    - docker tag fonteyncr.azurecr.io/booking fonteyncr.azurecr.io/booking:$CI_COMMIT_SHORT_SHA
    - docker tag fonteyncr.azurecr.io/hrm fonteyncr.azurecr.io/hrm:$CI_COMMIT_SHORT_SHA
    - docker push fonteyncr.azurecr.io/booking:$CI_COMMIT_SHORT_SHA
    - docker push fonteyncr.azurecr.io/hrm:$CI_COMMIT_SHORT_SHA

.deploy_template: &deploy_template
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - kubernetes
  before_script:
    - echo "$KUBECONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
  script:
    - sed "s|IMAGE_TAG|$CI_COMMIT_SHORT_SHA|g" apps/$APP_NAME/k8s/deployment.yaml | kubectl apply -f -
    - kubectl apply -f apps/$APP_NAME/k8s/service.yaml


deploy_booking:
  variables:
    APP_NAME: booking
  needs: ["build_all"]
  <<: *deploy_template

deploy_hrm:
  variables:
    APP_NAME: hrm
  needs: ["build_all"]
  <<: *deploy_template 

