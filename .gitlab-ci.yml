stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ''

build_all:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - build
  before_script:
    - docker login -u "fonteyncr" -p "Ywfz5AFidIRdwlYwl+qOs2CLxtp8Aq9QSa8KoBn5s7+ACRAJovcP" fonteyncr.azurecr.io
  script:
    - docker-compose up --build -d
    - docker tag fonteyncr.azurecr.io/booking fonteyncr.azurecr.io/booking:$CI_COMMIT_SHORT_SHA
    - docker tag fonteyncr.azurecr.io/hrm fonteyncr.azurecr.io/hrm:$CI_COMMIT_SHORT_SHA
    - docker push fonteyncr.azurecr.io/booking:$CI_COMMIT_SHORT_SHA
    - docker push fonteyncr.azurecr.io/hrm:$CI_COMMIT_SHORT_SHA

.deploy_template: &deploy_template
  stage: deploy
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - deploy
  before_script:
    - apt-get update && apt-get install -y curl unzip
    - curl -sLo kubelogin.zip \
        https://github.com/Azure/kubelogin/releases/latest/download/kubelogin-linux-amd64.zip
    - unzip kubelogin.zip -d /usr/local/bin
    - rm kubelogin.zip
    - chmod +x /usr/local/bin/kubelogin
    
    - echo "$KUBECONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
  script:
    - sed "s|IMAGE_TAG|$CI_COMMIT_SHORT_SHA|g" ./$APP_NAME/k8s/deployment.yml | kubectl apply -f -
    - kubectl apply -f ./$APP_NAME/k8s/service.yml


deploy_booking:
  variables:
    APP_NAME: test2
  needs: ["build_all"]
  <<: *deploy_template

deploy_hrm:
  variables:
    APP_NAME: HRM
  needs: ["build_all"]
  <<: *deploy_template 

