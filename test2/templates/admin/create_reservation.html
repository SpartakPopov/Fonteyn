{% extends "admin/base.html" %}

{% block content %}
<div class="admin-dashboard">
    <div class="dashboard-header">
        <h2>Create New Reservation</h2>
    </div>

    <div class="dashboard-section">
        <form method="POST" action="{{ url_for('admin_create_reservation') }}" class="admin-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="guest_name">Guest Name:</label>
                    <input type="text" id="guest_name" name="guest_name" required class="form-control" placeholder="Enter guest name">
                </div>
                
                <div class="form-group">
                    <label for="guest_email">Guest Email:</label>
                    <input type="email" id="guest_email" name="guest_email" required class="form-control" placeholder="Enter guest email">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="accommodation_type">Accommodation Type:</label>
                    <select id="accommodation_type" name="accommodation_type" required class="form-control">
                        {% for type, accommodation in accommodations.items() %}
                            <option value="{{ type }}">
                                {{ accommodation.name }} - €{{ accommodation.price }} per night
                                (Max guests: {{ accommodation.max_guests }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="check_in">Check-in Date:</label>
                    <input type="date" id="check_in" name="check_in" required class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="check_out">Check-out Date:</label>
                    <input type="date" id="check_out" name="check_out" required class="form-control">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="guests">Number of Guests:</label>
                    <input type="number" id="guests" name="guests" min="1" max="6" required class="form-control">
                </div>
                
                <div class="form-group">
                    <label for="status">Reservation Status:</label>
                    <select id="status" name="status" required class="form-control">
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Will you be bringing a vehicle?</label>
                    <div class="yes-no-buttons">
                        <input type="radio" id="has_vehicle_yes" name="has_vehicle" value="yes" onchange="toggleLicensePlate()" class="radio-hidden">
                        <label for="has_vehicle_yes" class="yes-no-button">Yes</label>
                        
                        <input type="radio" id="has_vehicle_no" name="has_vehicle" value="no" onchange="toggleLicensePlate()" class="radio-hidden" checked>
                        <label for="has_vehicle_no" class="yes-no-button">No</label>
                    </div>
                </div>
                
                <div class="form-group" id="license_plate_group" style="display: none;">
                    <label for="license_plate">License Plate Number:</label>
                    <input type="text" id="license_plate" name="license_plate" class="form-control" placeholder="Enter license plate number">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="cta-button">Create Reservation</button>
                <a href="{{ url_for('admin_dashboard') }}" class="cancel-button">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const checkInInput = document.getElementById('check_in');
    const checkOutInput = document.getElementById('check_out');
    const today = new Date().toISOString().split('T')[0];
    
    // Set minimum dates
    checkInInput.min = today;
    
    checkInInput.addEventListener('change', function() {
        checkOutInput.min = this.value;
        if (checkOutInput.value && checkOutInput.value < this.value) {
            checkOutInput.value = this.value;
        }
    });
});

function toggleLicensePlate() {
    const hasVehicle = document.querySelector('input[name="has_vehicle"]:checked').value;
    const licensePlateGroup = document.getElementById('license_plate_group');
    const licensePlateInput = document.getElementById('license_plate');
    
    if (hasVehicle === 'yes') {
        licensePlateGroup.style.display = 'block';
        licensePlateInput.required = true;
    } else {
        licensePlateGroup.style.display = 'none';
        licensePlateInput.required = false;
        licensePlateInput.value = '';
    }
}
</script>

<style>
.dark-select {
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #444 !important;
    padding: 8px 12px !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    width: 100% !important;
    transition: all 0.3s ease !important;
}

.dark-select:hover {
    background-color: #3c3c3c !important;
    border-color: #555 !important;
}

.dark-select:focus {
    outline: none !important;
    border-color: #666 !important;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1) !important;
}

.dark-input {
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #444 !important;
    padding: 8px 12px !important;
    border-radius: 4px !important;
    width: 100% !important;
    transition: all 0.3s ease !important;
}

.dark-input:focus {
    outline: none !important;
    border-color: #666 !important;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1) !important;
}

.dark-input::placeholder {
    color: #888 !important;
}

.yes-no-buttons {
    display: flex;
    gap: 10px;
    margin-top: 5px;
}

.radio-hidden {
    display: none;
}

.yes-no-button {
    flex: 1;
    padding: 10px 20px;
    text-align: center;
    background-color: #2c2c2c;
    color: #ffffff;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.yes-no-button:hover {
    background-color: #3c3c3c;
    border-color: #555;
}

.radio-hidden:checked + .yes-no-button {
    background-color: #4a4a4a;
    border-color: #666;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
}
</style>
{% endblock %}
