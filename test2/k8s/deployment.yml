apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      nodeSelector:
        app: booking
      containers:
        - name: booking
          image: fonteyncr.azurecr.io/booking:IMAGE_TAG
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: dotenv-volume
              mountPath: /app/.env
              subPath: .env
      volumes:
        - name: dotenv-volume
          configMap:
            name: booking-dotenv 