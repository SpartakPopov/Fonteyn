apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrm-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: hrm-tls-secret
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hrm-service
                port:
                  number: 8000