apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrm
  template:
    metadata:
      labels:
        app: hrm
    spec:
      nodeSelector:
        app: hrm
    containers:
      - name: hrm
        image: fonteyncr.azurecr.io/hrm:IMAGE_TAG
        ports:
          - containerPort: 8000
        envFrom:
          - configMapRef:
              name: .env