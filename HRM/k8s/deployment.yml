apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrm
  template:
    metadata:
      labels:
        app: hrm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - hrm
    containers:
      - name: hrm
        image: fonteyncr.azurecr.io/hrm:IMAGE_TAG
        ports:
          - containerPort: 80