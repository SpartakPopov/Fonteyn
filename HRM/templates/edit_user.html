<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Edit User</title>
</head>
<body>
    <h2>Edit User</h2>
    <form method="post" action="/edit_user/{{ user_id }}">
        <label for="display_name">Full Name:</label><br>
        <input type="text" id="display_name" name="display_name" value="{{ user_data.displayName | default('') }}" required><br><br>
        
        <label for="email">Email (User Principal Name):</label><br>
        <input type="email" id="email" name="email" value="{{ user_data.userPrincipalName | default('') }}" required><br><br>
        
        <label for="job_title">Job Title:</label><br>
        <input type="text" id="job_title" name="job_title" value="{{ user_data.jobTitle | default('') }}" required><br><br>
        
        <label for="group_ids">Groups:</label><br>
        <select id="group_ids" name="group_ids" multiple>
            {% for group in groups %}
                <option value="{{ group.id }}" {% if group.id in user_groups %}selected{% endif %}>{{ group.displayName }}</option>
            {% endfor %}
        </select><br><br>
        
        <input type="submit" value="Update User">
    </form>
    <br>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
