<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js"></script>
  <title>Dashboard</title>
</head>
<body>
  <h2>Welcome, {{ username }}</h2>
  <a href="/logout" class="logout-btn">Logout</a>
  
  {% if user_job_title == "HRMAdministrator" %}
    <a href="/register" class="btn">Register New User</a>
  {% endif %}
  
  <h3>All Employees</h3>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Job Title</th>
      </tr>
    </thead>
    <tbody>
      {% for employee in employees %}
      <tr>
        <td>{{ employee[0] }}</td>
        <td>{{ employee[1] }}</td>
        <td>{{ employee[2] }}</td>
        <td>{{ employee[3] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
