<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h2>Welcome, {{ username }}</h2>

         <br>
    {% if is_hrm_admin %}
        <a href="/register" class="btn">Register New User</a><br><br>
    {% endif %}
    <a href="/logout" class="btn">Logout</a>
    <h3>Employee List</h3>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Groups</th>
            {% if is_hrm_admin %}
                <th>Actions</th>
            {% endif %}
        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{ employee[1] }}</td>
            <td>{{ employee[2] }}</td>
            <td>{{ employee[3] }}</td>
            {% if is_hrm_admin %}
            <td>
                <a href="/edit_user/{{ employee[0] }}">Edit</a>
                <form action="/delete_user/{{ employee[0] }}" method="post" style="display:inline;">
                    <input type="submit" value="Delete" onclick="return confirm('Are you sure you want to delete this user?');">
                </form>
            </td>
            {% endif %}
        </tr>
        {% endfor %}
    </table>

</body>
</html>
