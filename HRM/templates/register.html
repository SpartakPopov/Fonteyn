<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/static/style.css">
  <title>Register New User</title>
</head>
<body>
  <h2>Register New User</h2>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/register">
    <label for="display_name">Full Name:</label><br>
    <input type="text" id="display_name" name="display_name" required><br><br>
    
    <label for="email">Email (User Principal Name):</label><br>
    <input type="email" id="email" name="email" required><br><br>
    
    <label for="job_title">Job Title:</label><br>
    <input type="text" id="job_title" name="job_title" required><br><br>
    
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>
    
    <input type="submit" value="Register">
  </form>
  <br>
  <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
